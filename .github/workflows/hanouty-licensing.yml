name: Hanouty offline licensing core
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'licensing/**'
      - '.github/workflows/hanouty-licensing.yml'
  push:
    paths:
      - 'licensing/**'
      - '.github/workflows/hanouty-licensing.yml'
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build offline licensing core
        run: dotnet build licensing/Hanouty.Licensing.Core/Hanouty.Licensing.Core.csproj -c Release --nologo
      - name: Build private offline issuer
        run: dotnet build licensing/Hanouty.Licensing.Issuer/Hanouty.Licensing.Issuer.csproj -c Release --nologo
      - name: Run signing and clock-drift regression
        run: dotnet run --project licensing/Hanouty.Licensing.Smoke/Hanouty.Licensing.Smoke.csproj -c Release
