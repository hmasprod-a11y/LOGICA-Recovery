name: LOGICA Windows reference diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - 'input/LOGICA-dependencies.zip'
jobs:
  diagnose:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unpack recovered project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'logica-diagnostic'
          New-Item -ItemType Directory -Force $src | Out-Null
          tar -xzf input/LOGICA-source-complete.tar.gz -C $src
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          if (-not (Test-Path (Join-Path $src 'LOGICA.csproj'))) { throw 'Project missing' }
      - name: Normalize only incorrect framework references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA.csproj'
          [xml]$xml = Get-Content -LiteralPath $project -Raw
          $removed = 0
          foreach ($group in @($xml.Project.ItemGroup)) {
            foreach ($ref in @($group.Reference)) {
              if ($null -ne $ref -and $ref.HintPath -match 'Microsoft[.]NETCore[.]App[/\\]10[.]') {
                $node = $ref.SelectSingleNode('HintPath')
                if ($null -ne $node) { [void]$ref.RemoveChild($node) }
                $removed++
              }
            }
          }
          $xml.Save($project)
          Write-Host "Removed invalid Linux .NET 10 HintPaths: $removed"
      - name: Load original LOGICA dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'input/LOGICA-dependencies.zip'
          if (-not (Test-Path -LiteralPath $archive)) {
            throw 'Missing input/LOGICA-dependencies.zip. Upload only the dependency archive from Codespaces.'
          }
          $deps = Join-Path $env:RUNNER_TEMP 'logica-dependencies'
          Expand-Archive -LiteralPath $archive -DestinationPath $deps
          $dlls = @(Get-ChildItem -LiteralPath $deps -Filter '*.dll' -Recurse -File)
          if ($dlls.Count -eq 0) { throw 'Dependency archive contains no DLL files.' }
          [xml]$xml = Get-Content (Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA.csproj') -Raw
          $group = $xml.CreateElement('ItemGroup')
          [void]$xml.Project.AppendChild($group)
          foreach ($dll in $dlls) {
            $reference = $xml.CreateElement('Reference')
            $reference.SetAttribute('Include', $dll.BaseName)
            $hint = $xml.CreateElement('HintPath')
            $hint.InnerText = $dll.FullName
            [void]$reference.AppendChild($hint)
            [void]$group.AppendChild($reference)
          }
          $xml.Save((Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA.csproj'))
          Write-Host "Original DLL references added: $($dlls.Count)"
      - name: Install resource compatibility package
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA.csproj'
          dotnet add $project package System.Resources.Extensions --version 4.7.1
          if ($LASTEXITCODE -ne 0) { throw 'Package restore failed' }
      - name: Trial fix for Bunifu checkbox event argument
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA'
          $count = 0
          $occurrences = 0
          foreach ($file in @(Get-ChildItem -LiteralPath $source -Filter '*.cs' -File)) {
            $body = [IO.File]::ReadAllText($file.FullName)
            # Cover callback parameter types as well as EventHandler<T>.
            $updated = [regex]::Replace($body, '(?<![.A-Za-z0-9_])CheckedChangedEventArgs\b', 'Bunifu.UI.WinForms.BunifuCheckBox.CheckedChangedEventArgs')
            if ($updated -ne $body) {
              $occurrences += ([regex]::Matches($body, '(?<![.A-Za-z0-9_])CheckedChangedEventArgs\b')).Count
              [IO.File]::WriteAllText($file.FullName, $updated)
              $count++
            }
          }
          Write-Host "Trial change applied to $count C# files and $occurrences references (temporary Windows runner only)."
      - name: Trial accessibility fix for invalid private virtual members
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA'
          $changed = 0
          $replacements = 0
          foreach ($file in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.cs' -File)) {
            $original = [IO.File]::ReadAllText($file.FullName)
            $pattern = '\bprivate\s+(?:(?:new|unsafe)\s+)*?(?:virtual|abstract)\b'
            $updated = [regex]::Replace($original, $pattern, {
              param($match)
              return [regex]::Replace($match.Value, '^private\b', 'protected')
            })
            if ($updated -ne $original) {
              $replacements += [regex]::Matches($original, $pattern).Count
              [IO.File]::WriteAllText($file.FullName, $updated)
              $changed++
            }
          }
          Write-Host "Trial modified $replacements declarations in $changed files. Original archive unchanged."
      - name: Trial resolution of remaining Timer and FormAnimator compiler issues
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA'
          $timerFiles = 0
          $animatorFiles = 0
          foreach ($file in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.cs' -File)) {
            $body = [IO.File]::ReadAllText($file.FullName)
            $updated = $body
            # Resolve bare Timer uses to the WinForms UI timer in UI files only.
            if ($body -match 'System[.]Windows[.]Forms' -and $body -match '\bTimer\b') {
              $updated = [regex]::Replace($updated, '(?<![.A-Za-z0-9_])Timer\b', 'System.Windows.Forms.Timer')
              if ($updated -ne $body) { $timerFiles++ }
            }
            # Remove sealed from FormAnimator declaration, preserving virtual accessors.
            if ($updated -match '\bsealed\s+class\s+FormAnimator\b') {
              $updated = [regex]::Replace($updated, '\bsealed\s+(?=class\s+FormAnimator\b)', '')
              $animatorFiles++
            }
            if ($updated -ne $body) { [IO.File]::WriteAllText($file.FullName, $updated) }
          }
          Write-Host "Trial Timer edits in $timerFiles files; FormAnimator declarations: $animatorFiles."
      - name: Compare safe BunifuGradientPanel aliases
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA'
          $project = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA.csproj'
          $files = @(Get-ChildItem $root -Recurse -Filter '*.cs' -File | Where-Object { [IO.File]::ReadAllText($_.FullName).Contains('BunifuGradientPanel') })
          $baseline = @{}
          foreach ($file in $files) { $baseline[$file.FullName] = [IO.File]::ReadAllText($file.FullName) }
          Write-Host "Candidate source files: $($files.Count)"
          foreach ($candidate in @('Bunifu.Framework.UI.BunifuGradientPanel','Bunifu.UI.WinForms.BunifuGradientPanel')) {
            foreach ($file in $files) {
              $before = $baseline[$file.FullName]
              $alias = 'using BunifuGradientPanel = ' + $candidate + ';' + [Environment]::NewLine
              [IO.File]::WriteAllText($file.FullName, $alias + $before)
            }
            $log = Join-Path $env:RUNNER_TEMP ('alias-' + ($candidate -replace '[.]','-') + '.log')
            & dotnet build $project --nologo -v:q -p:GenerateResourceUsePreserializedResources=true *> $log
            $result = $LASTEXITCODE
            $errors = @(Get-Content $log | Select-String 'error (CS|MSB|NETSDK|NU)[0-9]+')
            Write-Host "$candidate -- exit: $result, compiler error lines: $($errors.Count)"
            $codes = @($errors | ForEach-Object { [regex]::Match($_.Line, 'error ((?:CS|MSB|NETSDK|NU)[0-9]+)').Groups[1].Value } | Where-Object { $_ } | Group-Object | Sort-Object Count -Descending | Select-Object -First 8)
            foreach ($code in $codes) { Write-Host "$candidate / $($code.Name): $($code.Count)" }
            foreach ($file in $files) { [IO.File]::WriteAllText($file.FullName, $baseline[$file.FullName]) }
            Remove-Item $log -Force -ErrorAction SilentlyContinue
          }
      - name: Attempt Windows build and summarize error categories
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'logica-diagnostic/LOGICA.csproj'
          $log = Join-Path $env:RUNNER_TEMP 'logica-diagnostic-build.log'
          & dotnet build $project --nologo -v:q -p:GenerateResourceUsePreserializedResources=true *> $log
          $exit = $LASTEXITCODE
          $lines = @(Get-Content -LiteralPath $log)
          $groups = @($lines | Select-String 'error (CS|MSB|NETSDK|NU)[0-9]+' | ForEach-Object {
            [regex]::Match($_.Line, 'error ((?:CS|MSB|NETSDK|NU)[0-9]+)').Groups[1].Value
          } | Where-Object { $_ } | Group-Object | Sort-Object Count -Descending)
          Write-Host "Build exit: $exit"
          foreach ($g in $groups) { Write-Host "$($g.Name): $($g.Count)" }
          # Emit only a compact diagnostic category summary; no source code is printed.
          foreach ($code in @('CS0621','CS0104','CS0246','CS0549')) {
            $samples = @($lines | Select-String -Pattern ("error " + $code + ":") | Select-Object -First 2)
            foreach ($sample in $samples) {
              $msg = ($sample.Line -split ("error " + $code + ":"),2)[-1].Trim()
              $msg = $msg -replace '[A-Za-z]:\\[^ ]+', '[path]'
              Write-Host ($code + ' detail: ' + $msg.Substring(0,[Math]::Min(240,$msg.Length)))
            }
          }
          if ($exit -ne 0) { throw 'Build did not succeed; original sources unchanged.' }
      - name: Clean temporary sources
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'logica-diagnostic')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'logica-diagnostic-build.log')
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'logica-dependencies')
