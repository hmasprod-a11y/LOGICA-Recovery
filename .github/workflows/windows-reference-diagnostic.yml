name: LOGICA Windows build and POS verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'business/**'
      - 'modernization/**'
      - 'scripts/test-catalogue-core.ps1'
      - 'input/mysql-compatibility.sql'
      - 'input/recovered-original.sql'
      - 'input/LOGICA-dependencies.zip'
      - 'input/original-startup.json'
      - 'scripts/test-checkout-core.ps1'
      - 'scripts/repair-source.py'
      - 'scripts/Start-LOGICA.cmd'
      - 'scripts/Launch-LOGICA.ps1'
      - 'scripts/test-recovered-db.ps1'
      - 'scripts/setup-test-db.ps1'
      - 'recovered-source/**'
      - 'tests/**'
      - 'scripts/test-domain.ps1'
      - 'docs/RUNNING.md'
      - 'scripts/test-pos*'
      - 'scripts/test-release-candidate.ps1'
      - 'scripts/package-beta-rc.ps1'
      - 'scripts/package-runtime.ps1'
      - 'scripts/verify-beta-rc.ps1'
      - 'scripts/test-beta-release-verifier.ps1'
      - 'scripts/test-extracted-release.ps1'
      - 'scripts/test-release-upload-policy.py'
      - '.github/workflows/windows-reference-diagnostic.yml'
  push:
    paths:
      - 'business/**'
      - 'modernization/**'
      - 'scripts/test-catalogue-core.ps1'
      - 'input/LOGICA-dependencies.zip'
      - 'input/original-startup.json'
      - 'scripts/test-checkout-core.ps1'
      - 'scripts/test-domain.ps1'
      - 'tests/**'
      - 'scripts/Start-LOGICA.cmd'
      - 'scripts/Launch-LOGICA.ps1'
      - 'scripts/test-recovered-db.ps1'
      - 'scripts/setup-test-db.ps1'
      - 'recovered-source/**'
      - 'scripts/repair-source.py'
      - 'docs/RUNNING.md'
      - 'scripts/test-pos*'
      - 'scripts/test-recovered*'
      - 'scripts/test-release-candidate.ps1'
      - 'scripts/package-beta-rc.ps1'
      - 'scripts/package-runtime.ps1'
      - 'scripts/verify-beta-rc.ps1'
      - 'scripts/test-beta-release-verifier.ps1'
      - 'scripts/test-extracted-release.ps1'
      - 'scripts/test-release-upload-policy.py'
      - 'input/recovered-original.sql'
      - 'input/mysql-compatibility.sql'
      - '.github/workflows/windows-reference-diagnostic.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard release artifact upload policy (including negative fixtures)
        shell: pwsh
        run: python scripts/test-release-upload-policy.py
      - name: Compile shared modern core for dual targets when available
        if: ${{ hashFiles('modernization/LOGICA.CoreCompatibility.csproj') != '' }}
        shell: pwsh
        run: dotnet build modernization/LOGICA.CoreCompatibility.csproj -c Release --warnaserror
      - name: Exercise business operations .NET 10 smoke when available
        if: ${{ hashFiles('business/Hanouty.BusinessOperations.Smoke.csproj') != '' }}
        shell: pwsh
        run: dotnet run --project business/Hanouty.BusinessOperations.Smoke.csproj -c Release
      - name: Verify committed source is present
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'recovered-source/LOGICA.csproj')) {
            throw 'Authoritative committed project missing'
          }
      - name: Restore original runtime dependencies
        shell: pwsh
        run: |
          Expand-Archive input/LOGICA-dependencies.zip dependencies -Force
      - name: Build original project on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          dotnet build recovered-source/LOGICA.csproj -c Release --nologo -v:q -o dist *> results/build.log
          $result = $LASTEXITCODE
          Get-Content results/build.log | Select-String ': error ' | Sort-Object -Unique | Select-Object -First 60 | ForEach-Object { Write-Host $_ }
          if ($result -ne 0) { throw 'Windows build failed; see complete build.log' }
          Get-ChildItem dependencies -Recurse -File | ForEach-Object {
            $target=Join-Path 'dist' $_.Name
            if(-not (Test-Path $target)) { Copy-Item $_.FullName -Destination $target }
          }
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Set-Content results/runtime-manifest.json
      - name: Start isolated test database
        shell: pwsh
        run: ./scripts/setup-test-db.ps1
      - name: Exercise original POS on Windows
        shell: pwsh
        run: ./scripts/test-pos.ps1
      - name: Verify original recovered Access data on MySQL
        shell: pwsh
        run: ./scripts/test-recovered-db.ps1
      - name: Verify portable launcher with original data
        shell: pwsh
        run: |
          $bin=(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'logica-mariadb/server') -Recurse -Filter mariadb.exe | Select-Object -First 1).Directory.FullName
          Copy-Item scripts/Launch-LOGICA.ps1,scripts/Start-LOGICA.cmd dist
          try {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./dist/Launch-LOGICA.ps1 -ServerBin $bin -VerifyOnly *> results/portable-launcher.log
            if($LASTEXITCODE -ne 0){throw 'Portable launcher validation failed'}
            Get-Content results/portable-launcher.log | Select-String 'PASS|Produits|ERREUR'
          } finally {
            Remove-Item dist/bd/mysql-data,dist/bd/mysql-credential.xml,dist/bd/mysql-import-complete.txt -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Finalize portable runtime package
        if: always()
        shell: pwsh
        run: ./scripts/package-runtime.ps1
      - name: Gate unified beta candidate and generate file hashes
        shell: pwsh
        run: ./scripts/test-release-candidate.ps1
      - name: Test offline release verifier with isolated adversarial fixtures
        shell: pwsh
        run: ./scripts/test-beta-release-verifier.ps1
      - name: Build and independently verify beta RC ZIP
        shell: pwsh
        run: ./scripts/package-beta-rc.ps1
      - name: Smoke-test extracted customer ZIP with isolated MariaDB and real EXE
        shell: pwsh
        run: ./scripts/test-extracted-release.ps1
      - name: Inspect original dependency types
        if: always()
        shell: powershell
        run: |
          $names = @('Directions','BorderThickness','TextAlign','Indicator','BindingControlPositions','CheckStates','CheckBoxStyles','BorderEdges','BorderStyles','ButtonStates','Types','CapStyles','FillStyles')
          foreach ($dll in Get-ChildItem dependencies -Filter '*.dll' -Recurse) {
            try {
              $assembly = [Reflection.Assembly]::LoadFrom($dll.FullName)
              foreach ($t in $assembly.GetTypes()) { if ($names -contains $t.Name) { Write-Host ('ORIGINAL-TYPE ' + $t.FullName) } }
            } catch { }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LOGICA-build-diagnostics
          path: results/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LOGICA-2.0-Beta-RC1-Windows-x86
          path: release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LOGICA-Windows-complete
          path: dist/
          if-no-files-found: error
          retention-days: 90
