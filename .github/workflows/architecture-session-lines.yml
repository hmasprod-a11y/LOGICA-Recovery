name: Architecture current-session line snapshot regression
on:
  push:
    branches: [architecture/master-easy-code-core-boundary-20261103]
    paths: ['modernization/architecture/Hanouty.ArchitectureBridge/**', 'modernization/architecture/Hanouty.ArchitectureBridge.Tests/**', '.github/workflows/architecture-session-lines.yml']
  pull_request:
    paths: ['modernization/architecture/Hanouty.ArchitectureBridge/**', 'modernization/architecture/Hanouty.ArchitectureBridge.Tests/**', '.github/workflows/architecture-session-lines.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute actual Architecture session and financial gate regressions
        run: dotnet run --project modernization/architecture/Hanouty.ArchitectureBridge.Tests/Hanouty.ArchitectureBridge.Tests.csproj -c Release
