name: Architecture current-session line snapshot regression
on:
  push:
    branches: [architecture/master-easy-code-core-boundary-20261103]
    paths: ['modernization/architecture/**', '.github/workflows/architecture-session-lines.yml']
  pull_request:
    paths: ['modernization/architecture/**', '.github/workflows/architecture-session-lines.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-session:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify production shared-source boundaries
        run: python modernization/architecture/test_verify_core_boundaries.py
      - name: Verify boundary manifest
        run: python modernization/architecture/verify_core_boundaries.py
      - name: Execute actual Architecture session and financial gate regressions
        run: dotnet run --project modernization/architecture/Hanouty.ArchitectureBridge.Tests/Hanouty.ArchitectureBridge.Tests.csproj -c Release
  qa-merge-conflict-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The next step fetches QA from origin; retain the scoped checkout token.
          persist-credentials: true
      - name: Identify exact Architecture vs QA merge conflicts without changing either branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/integration/hanouty-qa-desktop-inventory-20261102
          echo "Architecture SHA: $(git rev-parse HEAD)"
          echo "QA SHA: $(git rev-parse FETCH_HEAD)"
          echo "Merge base: $(git merge-base HEAD FETCH_HEAD)"
          set +e
          git merge-tree --write-tree HEAD FETCH_HEAD > merge-tree-result.txt 2>&1
          status=$?
          set -e
          cat merge-tree-result.txt
          if [ "$status" -eq 1 ]; then
            echo "Conflicted paths (Git merge-tree):"
            git merge-tree --write-tree --name-only HEAD FETCH_HEAD || true
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Architecture/QA merge-tree reports conflicts or an execution error (exit $status). Review paths above; do not auto-merge."
            exit "$status"
          fi
          echo "No Git merge-tree conflicts on the checked SHAs."

      - name: Upload exact merge-tree diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-qa-merge-tree
          path: merge-tree-result.txt
          if-no-files-found: warn
