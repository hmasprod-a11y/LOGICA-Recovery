name: Domain characterization tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'recovered-source/**'
      - 'tests/**'
      - 'scripts/test-domain.ps1'
      - 'scripts/test-settlement-core.ps1'
      - 'scripts/test-cash-core.ps1'
      - 'scripts/test-stock-movement-core.ps1'
      - 'scripts/test-catalogue-core.ps1'
      - 'scripts/test-checkout-core.ps1'
      - '.github/workflows/domain-tests.yml'
  push:
    paths:
      - 'recovered-source/**'
      - 'tests/**'
      - 'scripts/test-domain.ps1'
      - '.github/workflows/domain-tests.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  domain:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the reviewed candidate, not GitHub's synthetic PR merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact candidate source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) {
            throw "Checkout provenance mismatch: expected $env:EXPECTED_SHA; actual $actual"
          }
          Write-Host "PASS: exact candidate source commit $actual"
      - name: Test financial rules without UI or database
        shell: powershell
        run: ./scripts/test-domain.ps1
      - name: Compile and test settlement core without VB, WinForms or database
        shell: powershell
        run: ./scripts/test-settlement-core.ps1
      - name: Compile and test cash core without VB, WinForms or database
        shell: powershell
        run: ./scripts/test-cash-core.ps1
      - name: Compile and test stock movement core without VB or database
        shell: powershell
        run: ./scripts/test-stock-movement-core.ps1
      - name: Compile and test shared client/stock export projection without WinForms
        shell: powershell
        run: ./scripts/test-export-core.ps1
      - name: Compile and test catalogue creation without VB or database
        shell: powershell
        run: ./scripts/test-catalogue-core.ps1
      - name: Compile and test checkout pricing/stock without VB or database
        shell: powershell
        run: ./scripts/test-checkout-core.ps1
