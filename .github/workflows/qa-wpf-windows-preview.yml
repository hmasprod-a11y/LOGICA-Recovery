name: QA WPF .NET 10 Windows preview acceptance
on:
  push:
    branches:
      - integration/hanouty-qa-desktop-inventory-20261102
    paths:
      - '.github/workflows/qa-wpf-windows-preview.yml'
      - 'scripts/verify-beta-rc.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpf-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA integration source at triggering SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: integration-source
      - name: Checkout reviewed WPF preview exact SHA
        uses: actions/checkout@v4
        with:
          # WPF belongs to Track 04; validate without merging preview into QA.
          ref: 9b8e7289648a86c8a89bfc1d2f28bd8bf7ee55ad
          persist-credentials: false
          path: wpf-preview
      - name: Assert QA and WPF source provenance
        shell: pwsh
        run: |
          $qa = (git -C integration-source rev-parse HEAD).Trim()
          if ($qa -ne '${{ github.sha }}') { throw "QA integration SHA mismatch: $qa" }
          $preview = (git -C wpf-preview rev-parse HEAD).Trim()
          if ($preview -ne '9b8e7289648a86c8a89bfc1d2f28bd8bf7ee55ad') { throw "WPF preview SHA mismatch: $preview" }
          "qa=$qa`nwpf=$preview" | Set-Content -LiteralPath source-provenance.txt
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reject legacy desktop dependencies and SQL in WPF presentation
        shell: pwsh
        run: |
          $project = Get-Content wpf-preview/modernization/Hanouty.Desktop.Wpf/Hanouty.Desktop.Wpf.csproj -Raw
          if ($project -notmatch '<TargetFramework>net10\.0-windows</TargetFramework>' -or $project -notmatch '<UseWPF>true</UseWPF>') { throw 'WPF host must target net10.0-windows with WPF enabled' }
          $source = Get-ChildItem wpf-preview/modernization/Hanouty.Desktop.Wpf -Recurse -File | Where-Object { $_.Extension -in @('.cs','.xaml') }
          foreach ($file in $source) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            if ($text -match '(?i)System\.Windows\.Forms|Microsoft\.VisualBasic|MySqlConnection|MySqlCommand|DbConnection|SELECT\s+.+\s+FROM|INSERT\s+INTO|UPDATE\s+\w+\s+SET|DELETE\s+FROM') {
              throw "Legacy desktop or inline SQL dependency in WPF presentation: $($file.FullName)"
            }
          }
          Write-Host 'PASS: preview WPF host uses .NET10; no detected WinForms/VB/MySQL SQL presentation dependencies'
      - name: Restore and build WPF executable
        shell: pwsh
        run: |
          dotnet restore wpf-preview/modernization/Hanouty.Desktop.Wpf/Hanouty.Desktop.Wpf.csproj
          dotnet build wpf-preview/modernization/Hanouty.Desktop.Wpf/Hanouty.Desktop.Wpf.csproj --no-restore -c Release -warnaserror
      - name: Run WPF MVVM regression on Windows
        shell: pwsh
        run: dotnet run --project wpf-preview/modernization/Hanouty.Desktop.Wpf.Tests/Hanouty.Desktop.Wpf.Tests.csproj -c Release
      - name: Assert real WPF executable was produced
        shell: pwsh
        run: |
          $exe = 'wpf-preview/modernization/Hanouty.Desktop.Wpf/bin/Release/net10.0-windows/Hanouty.Desktop.Wpf.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "WPF host EXE missing: $exe" }
          Write-Host "PASS WPF executable built from pinned source SHA; not a licensed sale or peripheral acceptance"

      - name: Verify publishable WPF runtime and create compatibility inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'wpf-preview/modernization/Hanouty.Desktop.Wpf/Hanouty.Desktop.Wpf.csproj'
          dotnet publish $project -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o wpf-publish
          $exe = 'wpf-publish/Hanouty.Desktop.Wpf.exe'
          $runtime = 'wpf-publish/Hanouty.Desktop.Wpf.runtimeconfig.json'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Published WPF executable missing' }
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw 'Published WPF runtimeconfig missing' }
          $config = Get-Content -LiteralPath $runtime -Raw | ConvertFrom-Json
          $frameworks = @($config.runtimeOptions.frameworks) + @($config.runtimeOptions.framework) | Where-Object { $_ }
          if (-not ($frameworks | Where-Object { $_.name -eq 'Microsoft.WindowsDesktop.App' -and $_.version -match '^10\\.' })) {
            throw 'Published WPF host must require WindowsDesktop.App 10'
          }
          $inventory = @()
          foreach ($file in (Get-ChildItem wpf-publish -File -Recurse)) {
            $relative = $file.FullName.Substring((Resolve-Path wpf-publish).Path.Length).TrimStart('\\','/')
            $inventory += [pscustomobject]@{
              path = $relative
              bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
              extension = $file.Extension.ToLowerInvariant()
            }
          }
          $inventory | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath wpf-publish-inventory.json
          $legacy = Get-ChildItem wpf-preview -Recurse -File | Where-Object { $_.Extension -in @('.rdlc','.rpt','.dll','.ocx','.pfx') } |
            ForEach-Object { [pscustomobject]@{ path = $_.FullName.Substring((Resolve-Path wpf-preview).Path.Length); extension = $_.Extension } }
          @($legacy) | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath peripheral-compatibility-inventory.json
          Write-Host 'PASS: published WPF runtime metadata and hashed artifact inventory; peripherals and license NOT field accepted'
      - name: Verify extracted customer preview ZIP has no secret payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path wpf-publish/* -DestinationPath wpf-preview.zip -Force
          New-Item -ItemType Directory -Path wpf-extracted | Out-Null
          Expand-Archive -LiteralPath wpf-preview.zip -DestinationPath wpf-extracted -Force
          if (-not (Test-Path wpf-extracted/Hanouty.Desktop.Wpf.exe)) { throw 'Extracted WPF EXE missing' }
          if (-not (Test-Path wpf-extracted/Hanouty.Desktop.Wpf.runtimeconfig.json)) { throw 'Extracted runtime configuration missing' }
          $bad = Get-ChildItem wpf-extracted -Recurse -File | Where-Object {
            $_.Name -match '^(?i:\\.env(?:\\..+)?|id_rsa|id_ed25519|credentials\\.json|hash_licence\\.sni)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hanouty-wpf-net10-preview-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            source-provenance.txt
            wpf-publish-inventory.json
            peripheral-compatibility-inventory.json
            wpf-preview.zip
            wpf-publish/**
            wpf-preview/modernization/Hanouty.Desktop.Wpf/bin/Release/net10.0-windows/**
 -or
            $_.Extension -match '^(?i:\\.sql|\\.pfx|\\.pem|\\.key|\\.kdbx)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hanouty-wpf-net10-preview-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            source-provenance.txt
            wpf-preview/modernization/Hanouty.Desktop.Wpf/bin/Release/net10.0-windows/**

          }
          if ($bad) { throw "Sensitive files in extracted preview: $($bad.FullName -join ', ')" }
          Write-Host 'PASS: extracted WPF preview structure and private-file denylist; startup/login/peripheral field acceptance NOT claimed'
      - name: Publish WPF executable preview with source provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hanouty-wpf-net10-preview-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            source-provenance.txt
            wpf-preview/modernization/Hanouty.Desktop.Wpf/bin/Release/net10.0-windows/**
