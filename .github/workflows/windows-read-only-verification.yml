name: LOGICA read-only Windows verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record immutable baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          git rev-parse HEAD | Set-Content results/source-commit.txt
      - name: Restore original dependencies
        shell: pwsh
        run: Expand-Archive input/LOGICA-dependencies.zip dependencies -Force
      - name: Build original source without repair
        shell: pwsh
        run: |
          dotnet build recovered-source/LOGICA.csproj -c Release --nologo -v:q -o dist *> results/build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content results/build.log | Select-String ': error ' | Select-Object -First 50 | ForEach-Object { Write-Host $_ }
            throw 'Original-source build failed; diagnostics preserved'
          }
          Get-ChildItem dependencies -Recurse -File | ForEach-Object {
            $target = Join-Path dist $_.Name
            if (-not (Test-Path $target)) { Copy-Item $_.FullName -Destination $target }
          }
      - name: Isolated database setup
        shell: pwsh
        run: ./scripts/setup-test-db.ps1
      - name: POS regression tests
        shell: pwsh
        run: ./scripts/test-pos.ps1
      - name: Recovered database regression tests
        shell: pwsh
        run: ./scripts/test-recovered-db.ps1
      - name: Verify tracked source unchanged
        if: always()
        shell: pwsh
        run: |
          $before = (Get-Content results/source-commit.txt -Raw).Trim()
          $after = (git rev-parse HEAD).Trim()
          if ($before -ne $after) { throw 'HEAD changed during verification' }
          $dirty = git status --porcelain --untracked-files=no -- recovered-source scripts input
          if ($dirty) { $dirty | Out-Host; throw 'Tracked source or test inputs changed during verification' }
          'PASS read-only tracked sources' | Set-Content results/source-integrity.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOGICA-read-only-diagnostics
          path: results/
          retention-days: 30
