name: QA WinForms Application namespace regression
on:
  push:
    branches: [integration/hanouty-qa-desktop-inventory-20261102]
    paths:
      - 'recovered-source/**/*.cs'
      - '.github/workflows/qa-winforms-application-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application-namespace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect every recovered C# source and enforce qualified WinForms callsites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem recovered-source -Filter '*.cs' -Recurse)
          if ($files.Count -eq 0) { throw 'No recovered C# sources found' }
          $issues = @()
          $violationCount = 0
          foreach ($file in $files) {
            $source = [IO.File]::ReadAllText($file.FullName)
            # Inspect code, not configuration sentinel strings/comments. In
            # particular, the persisted token "Application.StartupPath" must
            # remain compatible with existing .sni files.
            $source = [regex]::Replace($source, '(?s)//[^\\r\\n]*|/\\*.*?\\*/|@"(?:""|[^"])*"|"(?:\\\\.|[^"\\\\])*"', '')
            # In LOGICA namespace, unqualified Application resolves to LOGICA.Application.
            # Only bare Application is ambiguous; qualified System.Windows.Forms.Application is valid.
            if ($source -match '(?m)^namespace\s+LOGICA(?:\.[\w.]+)?\s*[;{]' -and
                $source -match '(?<![\w.:])Application\.(StartupPath|DoEvents|Exit|ExitThread|ExecutablePath|OpenForms|ProductName|Restart|Run|SetHighDpiMode|SetCompatibleTextRenderingDefault|EnableVisualStyles)\b') {
              $matches = [regex]::Matches($source, '(?<![\w.:])Application\.(StartupPath|DoEvents|Exit|ExitThread|ExecutablePath|OpenForms|ProductName|Restart|Run|SetHighDpiMode|SetCompatibleTextRenderingDefault|EnableVisualStyles)\b')
              $violationCount += $matches.Count
              $issues += "$($file.FullName) ($($matches.Count) callsites)"
            }
          }
          Write-Host "Inspected $($files.Count) recovered C# files; $violationCount ambiguous WinForms Application callsites across $($issues.Count) files."
          if ($issues.Count) { throw "Ambiguous Application references: $($issues -join ', ')" }
