name: Hanouty modern core compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modernization/**'
      - 'recovered-source/LOGICA/Domain/**'
      - 'recovered-source/LOGICA/Application/**'
      - 'recovered-source/LOGICA/Infrastructure/**'
      - '.github/workflows/hanouty-modern-core-compatibility.yml'
permissions:
  contents: read
jobs:
  compile-shared-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the reviewed candidate, not GitHub's synthetic PR merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact candidate source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) {
            throw "Checkout provenance mismatch: expected $env:EXPECTED_SHA; actual $actual"
          }
          Write-Host "PASS: exact candidate source commit $actual"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile identical production sources for legacy-compatible and modern targets
        run: dotnet build modernization/LOGICA.CoreCompatibility.csproj -c Release --warnaserror
      - name: Execute existing modern core regression smoke
        run: dotnet run --project modernization/LOGICA.CoreSmoke.csproj -c Release
