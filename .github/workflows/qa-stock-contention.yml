name: QA disposable InnoDB stock contention fixture
on:
  push:
    branches: [integration/hanouty-qa-desktop-inventory-20261102]
    paths: ['scripts/qa-stock-contention-disposable.sh', '.github/workflows/qa-stock-contention.yml']
  pull_request:
    paths: ['scripts/qa-stock-contention-disposable.sh', '.github/workflows/qa-stock-contention.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-engine-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: checkout_disposable
          MARIADB_USER: checkout_test
          MARIADB_PASSWORD: checkout-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable SQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
      - name: Validate endpoint guards before any SQL invocation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/qa-stock-contention-disposable.sh
          for fixture in '192.0.2.1:3306:checkout_disposable' '127.0.0.1:3306:shop' '127.0.0.1:3307:checkout_disposable'; do
            IFS=: read -r fixture_host fixture_port fixture_schema <<< "$fixture"
            set +e
            HANOUTY_DISPOSABLE_DB_ONLY=YES MYSQL_HOST="$fixture_host" MYSQL_PORT="$fixture_port" MYSQL_DATABASE="$fixture_schema" bash scripts/qa-stock-contention-disposable.sh > guard.log 2>&1
            status=$?
            set -e
            test "$status" = 2
            grep -F 'Fixture requires explicit disposable' guard.log
          done
      - name: Execute real competing transactions and rollback
        env:
          HANOUTY_DISPOSABLE_DB_ONLY: 'YES'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: checkout_disposable
          MYSQL_USER: checkout_test
          MYSQL_PWD: checkout-test-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          sha256sum scripts/qa-stock-contention-disposable.sh > evidence/script-sha256.txt
          bash scripts/qa-stock-contention-disposable.sh | tee evidence/stock-contention.log
          echo 'SCOPE: isolated InnoDB fixture, not production Checkout/Inventory authorization acceptance' | tee evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-innodb-stock-contention
          path: evidence/
          if-no-files-found: warn
