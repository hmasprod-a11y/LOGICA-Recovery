name: Hanouty Checkout production and full-ticket return integration
on:
  pull_request:
    paths:
      - 'recovered-source/LOGICA/Infrastructure/Checkout/**'
      - 'recovered-source/LOGICA/Application/Checkout/**'
      - 'recovered-source/LOGICA/Infrastructure/Compatibility/VisualBasic*Semantics.cs'
      - 'modernization/checkout-mariadb-boundary/**'
      - 'modernization/checkout-mariadb-production/**'
      - '.github/workflows/hanouty-checkout-atomic-mariadb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: checkout_disposable
          MARIADB_USER: checkout_test
          MARIADB_PASSWORD: checkout-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exercise production Checkout boundary on verified disposable InnoDB
        env:
          CHECKOUT_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=checkout_disposable;Uid=checkout_test;Pwd=checkout-test-only;SslMode=Disabled;
        run: dotnet run --project modernization/checkout-mariadb-boundary/CheckoutMariaDbBoundary.csproj --configuration Release
      - name: Compile integrated production checkout against QA ArchitectureBridge
        run: dotnet build modernization/checkout-mariadb-production/CheckoutMariaDbProduction.csproj --configuration Release --no-incremental
