name: Hanouty checkout atomic MariaDB contract
on:
  pull_request:
    paths:
      - 'recovered-source/LOGICA/Infrastructure/Checkout/**'
      - 'recovered-source/LOGICA/Application/Checkout/**'
      - 'recovered-source/LOGICA/Infrastructure/Compatibility/VisualBasic*Semantics.cs'
      - 'recovered-source/LOGICA/Infrastructure/Checkout/hanouty_checkout_operations.disposable.sql'
      - 'scripts/test-checkout-atomic-mariadb.sh'
      - 'modernization/checkout-mariadb-boundary/**'
      - '.github/workflows/hanouty-checkout-atomic-mariadb.yml'
  workflow_dispatch:
jobs:
  isolated-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: checkout_disposable
          MARIADB_USER: checkout_test
          MARIADB_PASSWORD: checkout-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout approved Architecture source for real financial port
        uses: actions/checkout@v4
        with:
          ref: f934763edbb0ae15c5e2a449bf6440b0d1bcca39
          path: architecture-source
          persist-credentials: false
      - name: Verify exact Architecture source
        run: test "$(git -C architecture-source rev-parse HEAD)" = "f934763edbb0ae15c5e2a449bf6440b0d1bcca39"
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Exercise isolated transaction and durable claim
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: checkout_disposable
          DB_USER: checkout_test
          MYSQL_PWD: checkout-test-only
        run: bash scripts/test-checkout-atomic-mariadb.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exercise actual C# production MariaDB boundary
        env:
          CHECKOUT_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=checkout_disposable;Uid=checkout_test;Pwd=checkout-test-only;SslMode=Disabled;
        run: dotnet run --project modernization/checkout-mariadb-boundary/CheckoutMariaDbBoundary.csproj --configuration Release
