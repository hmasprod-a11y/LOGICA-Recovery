name: Portable core .NET 10 Linux gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modernization/**'
      - 'scripts/verify-beta-rc.ps1'
      - 'scripts/test-beta-release-verifier.ps1'
      - 'recovered-source/LOGICA/Domain/**'
      - 'recovered-source/LOGICA/Application/Cash/**'
      - 'recovered-source/LOGICA/Application/Clients/**'
      - 'recovered-source/LOGICA/Application/Checkout/**'
      - 'recovered-source/LOGICA/Application/Inventory/**'
      - 'recovered-source/LOGICA/Application/Catalogue/**'
      - '.github/workflows/portable-core.yml'
  push:
    paths:
      - 'modernization/**'
      - 'scripts/test-todo-license-cli.ps1'
      - 'recovered-source/LOGICA/Application/Inventory/**'
      - 'recovered-source/LOGICA/Application/Catalogue/**'
      - '.github/workflows/portable-core.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated production core as .NET 10 library
        run: dotnet build modernization/LOGICA.CorePortability.csproj -c Release --nologo
      - name: Execute Linux smoke tests for cash, settlement, checkout and inventory
        run: dotnet run --project modernization/LOGICA.CoreSmoke.csproj -c Release
      - name: Build and exercise TODO POS offline licensing core on Linux
        run: dotnet run --project modernization/TODO.Licensing.Tests/TODO.Licensing.Tests.csproj -c Release
      - name: Test TODO POS offline issuer CLI end-to-end on Linux
        shell: pwsh
        run: ./scripts/test-todo-license-cli.ps1
      - name: Cross-platform offline beta verifier regression tests
        shell: pwsh
        run: ./scripts/test-beta-release-verifier.ps1
