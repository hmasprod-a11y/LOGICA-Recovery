name: QA W1 real MariaDB Catalogue Reader
on:
  push:
    branches: [integration/hanouty-qa-desktop-inventory-20261102]
    paths:
      - 'modernization/inventory/Hanouty.Inventory.MariaDb/**'
      - 'modernization/inventory/Hanouty.Inventory.MariaDb.Tests/**'
      - 'modernization/architecture/Hanouty.ArchitectureBridge/**'
      - '.github/workflows/qa-w1-catalogue-mariadb.yml'
  pull_request:
    paths:
      - 'modernization/inventory/Hanouty.Inventory.MariaDb/**'
      - 'modernization/inventory/Hanouty.Inventory.MariaDb.Tests/**'
      - 'modernization/architecture/Hanouty.ArchitectureBridge/**'
      - '.github/workflows/qa-w1-catalogue-mariadb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue-reader-real-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: qa-w1-disposable-root
          MARIADB_DATABASE: logica_ci
          MARIADB_USER: qa_w1
          MARIADB_PASSWORD: qa-w1-disposable-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile production catalogue reader and actual database tests
        run: dotnet build modernization/inventory/Hanouty.Inventory.MariaDb.Tests/Hanouty.Inventory.MariaDb.Tests.csproj -c Release --warnaserror
      - name: Run real MariaDB W1 catalogue reader acceptance
        env:
          HANOUTY_W1_TEST_DB: Server=127.0.0.1;Port=3307;Database=logica_ci;Uid=qa_w1;Pwd=qa-w1-disposable-only;SslMode=Disabled;
        run: dotnet run --project modernization/inventory/Hanouty.Inventory.MariaDb.Tests/Hanouty.Inventory.MariaDb.Tests.csproj -c Release --no-build
