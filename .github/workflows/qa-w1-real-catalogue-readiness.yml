name: QA W1 real catalogue integration readiness
on:
  workflow_dispatch:
    inputs:
      wpf_sha:
        description: 'Reviewed WPF PR #96 commit SHA (40 hex)'
        required: true
        type: string
      architecture_sha:
        description: 'Reviewed Architecture PR #95 commit SHA (40 hex)'
        required: true
        type: string
      inventory_sha:
        description: 'Reviewed Inventory PR #88 commit SHA (40 hex)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  real-catalogue-readiness:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validate pinned reviewed source IDs
        shell: pwsh
        run: |
          foreach ($sha in @('${{ inputs.wpf_sha }}','${{ inputs.inventory_sha }}','${{ inputs.architecture_sha }}')) {
            if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw "Expected exact 40-hex source SHA: $sha" }
          }
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.wpf_sha }}
          path: wpf
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.architecture_sha }}
          path: architecture
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.inventory_sha }}
          path: inventory
          persist-credentials: false
      - name: Assert four exact source identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($entry in @(@('qa','${{ github.sha }}'),@('wpf','${{ inputs.wpf_sha }}'),@('inventory','${{ inputs.inventory_sha }}'),@('architecture','${{ inputs.architecture_sha }}'))) {
            $actual = (git -C $entry[0] rev-parse HEAD).Trim()
            if ($actual -cne $entry[1]) { throw "Unexpected source for $($entry[0]): $actual" }
            "$($entry[0])=$actual" | Add-Content provenance-w1.txt
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF on Windows
        shell: pwsh
        run: |
          dotnet build wpf/modernization/Hanouty.Desktop.Wpf/Hanouty.Desktop.Wpf.csproj -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'WPF Windows build failed' }
      - name: Verify WPF and Architecture catalogue API compatibility before database acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wpfApi = 'wpf/modernization/Hanouty.Desktop.Wpf/Presentation/CatalogueViewModel.cs'
          $architectureApi = 'architecture/modernization/architecture/Hanouty.ArchitectureBridge/CheckoutComposition.cs'
          if (-not (Test-Path -LiteralPath $wpfApi)) { throw "W1 BLOCKED: missing WPF catalogue contract: $wpfApi" }
          if (-not (Test-Path -LiteralPath $architectureApi)) { throw "W1 BLOCKED: missing architecture checkout contract: $architectureApi" }
          $wpf = Get-Content -LiteralPath $wpfApi -Raw
          $architecture = Get-Content -LiteralPath $architectureApi -Raw
          if ($wpf -match 'interface\s+ICatalogueReader\s*\{[^}]*ReadProducts\s*\(' -and
              $architecture -match 'interface\s+ICatalogueReader\s*\{[^}]*ListAll\s*\(') {
            throw 'W1 BLOCKED: two incompatible ICatalogueReader contracts (WPF ReadProducts vs Architecture ListAll). Approved adapter and real composition required; preview cannot satisfy W1.'
          }
          Write-Host 'Catalogue contract mismatch pattern not detected; real MariaDB acceptance still mandatory'
      - name: Fail closed on preview-only catalogue composition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'wpf/modernization/Hanouty.Desktop.Wpf'
          $hostFile = Join-Path $root 'MainWindow.xaml.cs'
          if (-not (Test-Path -LiteralPath $hostFile)) { throw 'Cannot locate production WPF composition root' }
          $hostCode = Get-Content -LiteralPath $hostFile -Raw
          if ($hostCode -match 'new\s+EmptyCatalogueReader\s*\(') {
            throw 'W1 BLOCKED: production WPF MainWindow still instantiates EmptyCatalogueReader; no real MariaDB catalogue accepted'
          }
          $production = @(Get-ChildItem $root -Recurse -File -Filter '*.cs' | Where-Object { $_.FullName -notmatch '[\\/]obj[\\/]|[\\/]bin[\\/]' })
          $preview = @($production | Where-Object { (Get-Content $_.FullName -Raw) -match 'new\s+PreviewProductSelection\s*\(' })
          if ($preview.Count -gt 0) { throw "W2 BLOCKED: production WPF still instantiates PreviewProductSelection: $($preview.FullName -join ', ')" }
          Write-Host 'PASS: no detected production preview catalogue or checkout composition; DB acceptance still separately required'
      - name: Require executable disposable MariaDB acceptance suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suite = 'qa/tests/w1-real-catalogue-mariadb.ps1'
          if (-not (Test-Path -LiteralPath $suite -PathType Leaf)) {
            throw "W1 NOT ACCEPTED: missing QA-owned disposable MariaDB + WPF production acceptance runner: $suite"
          }
          & $suite -WpfRoot 'wpf' -InventoryRoot 'inventory'
          if (-not $?) { throw 'W1 real MariaDB catalogue acceptance failed' }
      - name: Upload provenance on failed acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanouty-w1-source-provenance-${{ github.run_id }}
          if-no-files-found: warn
          path: provenance-w1.txt
