name: QA W2 cash-sale production graph and acceptance
on:
  push:
    branches: [integration/hanouty-qa-desktop-inventory-20261102]
    paths: ['.github/workflows/qa-w2-cash-sale.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w2-financial-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: checkout_disposable
          MARIADB_USER: checkout_test
          MARIADB_PASSWORD: checkout-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f87aada22d596838100e50c23e51a79f640b4ad4
          path: checkout
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5c73e78002f07121fdc85eb6272dcbd1bae5b31f
          path: architecture
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Initialize disposable operation ledger using reviewed Checkout fixture
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: checkout_disposable
          DB_USER: checkout_test
          MYSQL_PWD: checkout-test-only
        working-directory: checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          bash scripts/test-checkout-atomic-mariadb.sh
      - name: Execute production financial boundary against disposable MariaDB with QA Architecture
        env:
          CHECKOUT_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=checkout_disposable;Uid=checkout_test;Pwd=checkout-test-only;SslMode=Disabled;
        run: |
          set -euo pipefail
          test "$(git -C checkout rev-parse HEAD)" = f87aada22d596838100e50c23e51a79f640b4ad4
          cp -a architecture/modernization/architecture/. qa/modernization/architecture/
          cp -a architecture/recovered-source/. qa/recovered-source/
          test -f qa/modernization/architecture/Hanouty.ArchitectureBridge/Hanouty.ArchitectureBridge.csproj
          arch="$PWD/qa/modernization/architecture/Hanouty.ArchitectureBridge/Hanouty.ArchitectureBridge.csproj"
          dotnet run --project checkout/modernization/checkout-mariadb-boundary/CheckoutMariaDbBoundary.csproj --configuration Release --property:ArchitectureProject="$arch"
          echo 'FINANCIAL_BOUNDARY_ONLY: real SQL exercised; WPF authorization and E2E remain unaccepted'
  w2-cash-sale:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: f87aada22d596838100e50c23e51a79f640b4ad4
          path: checkout
      - uses: actions/checkout@v4
        with:
          ref: 5c73e78002f07121fdc85eb6272dcbd1bae5b31f
          path: architecture
      - uses: actions/checkout@v4
        with:
          ref: ffd5fb3ae186bebab97ad5f989c70d1b301c528b
          path: wpf
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build real checkout production library with one Architecture assembly
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory evidence -Force | Out-Null
          foreach($name in @('qa','checkout','architecture','wpf')) {
            "$name=$((git -C $name rev-parse HEAD).Trim())" | Add-Content evidence/source-manifest.txt
          }
          # Compose one executable project graph. Do not build the independent WPF checkout:
          # its relative Architecture reference is absent in that checkout and would
          # compile a different Architecture assembly from the financial library.
          $qa=(Resolve-Path qa).Path
          $wpf=(Resolve-Path wpf/modernization/Hanouty.Desktop.Wpf).Path
          # Exact PR95 contracts and linked production sources form one assembly.
          Copy-Item architecture/modernization/architecture qa/modernization -Recurse -Force
          Copy-Item architecture/recovered-source qa -Recurse -Force
          Copy-Item wpf/modernization/Hanouty.Desktop.Wpf.Tests qa/modernization -Recurse -Force
          $wpfDestination=Join-Path $qa 'modernization/Hanouty.Desktop.Wpf'
          New-Item -ItemType Directory $wpfDestination -Force | Out-Null
          Copy-Item (Join-Path $wpf '*') $wpfDestination -Recurse -Force
          $architectureProject=(Resolve-Path (Join-Path $qa 'modernization/architecture/Hanouty.ArchitectureBridge/Hanouty.ArchitectureBridge.csproj')).Path
          $checkoutProject=(Resolve-Path checkout/modernization/checkout-mariadb-production/CheckoutMariaDbProduction.csproj).Path
          dotnet build $checkoutProject -c Release --nologo "-p:ArchitectureProject=$architectureProject"
          if($LASTEXITCODE -ne 0) { throw 'CHECKOUT_OWNER: production Checkout failed against the single QA Architecture project' }
          dotnet build (Join-Path $wpfDestination 'Hanouty.Desktop.Wpf.csproj') -c Release --nologo
          if($LASTEXITCODE -ne 0) { throw 'WPF_OWNER: actual WPF project failed against composed QA Architecture project' }
          dotnet build (Join-Path $qa 'modernization/Hanouty.Desktop.Bootstrap/Hanouty.Desktop.Bootstrap.csproj') -c Release --nologo "-p:ArchitectureProject=$architectureProject" "-p:CheckoutProductionProject=$checkoutProject"
          if($LASTEXITCODE -ne 0) { throw 'ARCHITECTURE_OWNER: composed QA Host failed build' }
          dotnet run --project qa/modernization/Hanouty.Desktop.Wpf.Tests/Hanouty.Desktop.Wpf.Tests.csproj -c Release
          if($LASTEXITCODE -ne 0) { throw 'WPF_OWNER: full actual WPF test suite failed' }
          dotnet run --project qa/modernization/architecture/Hanouty.WpfContractAdapter.Tests/Hanouty.WpfContractAdapter.Tests.csproj -c Release
          if($LASTEXITCODE -ne 0) { throw 'ARCHITECTURE_OWNER: financial reconciliation adapter regressions failed' }
          # Verify the actual build inputs, not merely independent passing checkouts.
          $manifest=@('architecture='+((git -C architecture rev-parse HEAD).Trim()),'checkout='+((git -C checkout rev-parse HEAD).Trim()),'wpf='+((git -C wpf rev-parse HEAD).Trim()),'qa='+((git -C qa rev-parse HEAD).Trim()))
          $manifest | Set-Content evidence/composed-source-manifest.txt
      - name: Execute cash-sale acceptance starting with empty TABLE_XX
        shell: pwsh
        run: |
          # Execute the newly compiled actual financial Host, not a text-based readiness check.
          # The disposable MariaDB/fixture is mandatory: missing setup must fail this gate.
          $hostExe = Join-Path (Resolve-Path qa).Path 'modernization/Hanouty.Desktop.Bootstrap/bin/Release/net10.0-windows/Hanouty.Desktop.Bootstrap.exe'
          if (-not (Test-Path $hostExe)) { throw 'QA_OWNER: financial Host executable missing' }
          $env:HANOUTY_W2_DISPOSABLE_MARKER = 'I_ACKNOWLEDGE_DISPOSABLE_DB_ONLY'
          & $hostExe --verify-disposable-cash-sale (Join-Path (Resolve-Path evidence).Path 'w2')
          if ($LASTEXITCODE -ne 0) {
            Get-Content evidence/w2/w2-failure.txt -ErrorAction SilentlyContinue | Write-Host
            throw 'QA_OWNER W2_NOT_ACCEPTED: real WPF cash-sale runner failed; see w2-failure.txt'
          }
      - name: Upload source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-w2-production-source-manifest
          path: evidence/
          if-no-files-found: warn
