name: QA W2 financial production graph and acceptance
on:
  push:
    branches: [integration/hanouty-qa-desktop-inventory-20261102]
    paths:
      - '.github/workflows/qa-w2-cash-sale.yml'
      - 'modernization/Hanouty.Desktop.Bootstrap/**'
      - 'modernization/Hanouty.Desktop.Wpf/**'
      - 'modernization/Hanouty.Desktop.Wpf.Tests/**'
      - 'modernization/checkout-mariadb-boundary/**'
      - 'modernization/checkout-mariadb-production/**'
      - 'modernization/architecture/**'
      - 'recovered-source/LOGICA/Application/Checkout/**'
      - 'recovered-source/LOGICA/Infrastructure/Checkout/**'
      - 'scripts/Package-HanoutyWpf.ps1'
      - 'scripts/Test-HanoutyFinancialPackage.ps1'
      - 'scripts/Start-Hanouty-Test.ps1'
      - 'scripts/Start-Hanouty-Test.cmd'
      - 'scripts/HANOUTY-TEST-START-HERE.txt'
  pull_request:
    branches: [integration/hanouty-qa-desktop-inventory-20261102]
    paths:
      - '.github/workflows/qa-w2-cash-sale.yml'
      - 'modernization/Hanouty.Desktop.Bootstrap/**'
      - 'modernization/Hanouty.Desktop.Wpf/**'
      - 'modernization/Hanouty.Desktop.Wpf.Tests/**'
      - 'modernization/checkout-mariadb-boundary/**'
      - 'modernization/checkout-mariadb-production/**'
      - 'modernization/architecture/**'
      - 'recovered-source/LOGICA/Application/Checkout/**'
      - 'recovered-source/LOGICA/Infrastructure/Checkout/**'
      - 'scripts/Package-HanoutyWpf.ps1'
      - 'scripts/Test-HanoutyFinancialPackage.ps1'
      - 'scripts/Start-Hanouty-Test.ps1'
      - 'scripts/Start-Hanouty-Test.cmd'
      - 'scripts/HANOUTY-TEST-START-HERE.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w2-financial-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: checkout_disposable
          MARIADB_USER: checkout_test
          MARIADB_PASSWORD: checkout-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run current-commit production Checkout return boundary
        env:
          CHECKOUT_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=checkout_disposable;Uid=checkout_test;Pwd=checkout-test-only;SslMode=Disabled;
        run: |
          set -euo pipefail
          arch="$PWD/modernization/architecture/Hanouty.ArchitectureBridge/Hanouty.ArchitectureBridge.csproj"
          test -f "$arch"
          dotnet run --project modernization/checkout-mariadb-boundary/CheckoutMariaDbBoundary.csproj --configuration Release --property:ArchitectureProject="$arch"
          echo 'PASS: current-commit production Checkout/MariaDB return boundary'
  w2-wpf-mariadb-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test one current-source WPF/Checkout/Host graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory evidence -Force | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:GITHUB_SHA) { throw "Source SHA mismatch: checkout=$sha event=$env:GITHUB_SHA" }
          "qa=$sha" | Set-Content evidence/source-manifest.txt
          $architectureProject = (Resolve-Path 'modernization/architecture/Hanouty.ArchitectureBridge/Hanouty.ArchitectureBridge.csproj').Path
          $checkoutProject = (Resolve-Path 'modernization/checkout-mariadb-production/CheckoutMariaDbProduction.csproj').Path
          $wpfProject = 'modernization/Hanouty.Desktop.Wpf/Hanouty.Desktop.Wpf.csproj'
          $hostProject = 'modernization/Hanouty.Desktop.Bootstrap/Hanouty.Desktop.Bootstrap.csproj'
          dotnet build $checkoutProject -c Release --nologo "-p:ArchitectureProject=$architectureProject"
          if ($LASTEXITCODE -ne 0) { throw 'CHECKOUT_OWNER: current SHA production Checkout build failed' }
          dotnet build $wpfProject -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'WPF_OWNER: current SHA WPF build failed' }
          dotnet build $hostProject -c Release --nologo "-p:ArchitectureProject=$architectureProject" "-p:CheckoutProductionProject=$checkoutProject"
          if ($LASTEXITCODE -ne 0) { throw 'HOST_OWNER: current SHA real financial Host build failed' }
          dotnet run --project modernization/Hanouty.Desktop.Wpf.Tests/Hanouty.Desktop.Wpf.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'WPF_OWNER: current SHA Windows STA suite failed' }
          dotnet run --project modernization/architecture/Hanouty.WpfContractAdapter.Tests/Hanouty.WpfContractAdapter.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'ARCHITECTURE_OWNER: current SHA WPF/Checkout adapter suite failed' }
          dotnet run --project modernization/stock-authorization-acceptance/StockAuthorizationAcceptance.csproj -c Release -- --no-database
          if ($LASTEXITCODE -ne 0) { throw 'INVENTORY_OWNER: current SHA manual-write denial gate failed' }
          $manifest = "checkout=$sha" + [Environment]::NewLine + "architecture=$sha" + [Environment]::NewLine + "wpf=$sha" + [Environment]::NewLine + "host=$sha"
          $manifest | Set-Content evidence/composed-source-manifest.txt
      - name: Start checksum-verified disposable MariaDB without installing a service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dbRoot = Join-Path $env:RUNNER_TEMP 'hanouty-w2-cash-mariadb'
          New-Item -ItemType Directory -Force $dbRoot | Out-Null
          $url = 'https://archive.mariadb.org/mariadb-10.11.14/winx64-packages'
          Invoke-WebRequest "$url/mariadb-10.11.14-winx64.zip" -OutFile "$dbRoot/server.zip"
          $checks = (Invoke-WebRequest "$url/sha256sums.txt").Content
          $expected = (($checks -split '\r?\n' | Where-Object { $_ -match 'mariadb-10.11.14-winx64.zip\s*$' }) -split '\s+')[0]
          if ((Get-FileHash "$dbRoot/server.zip" -Algorithm SHA256).Hash -ne $expected) { throw 'MariaDB checksum mismatch' }
          Expand-Archive "$dbRoot/server.zip" "$dbRoot/server"
          $bin = (Get-ChildItem "$dbRoot/server" -Recurse -Filter mariadb-install-db.exe | Select-Object -First 1).Directory.FullName
          & "$bin/mariadb-install-db.exe" "--datadir=$dbRoot/data" --password=logica-ci-only --port=3307
          if ($LASTEXITCODE -ne 0) { throw 'Disposable MariaDB initialization failed' }
          $server = Start-Process "$bin/mariadbd.exe" -ArgumentList @("--defaults-file=$dbRoot/data/my.ini", '--bind-address=127.0.0.1', '--port=3307') -WindowStyle Hidden -PassThru
          "HANOUTY_W2_SERVER_PID=$($server.Id)" | Out-File $env:GITHUB_ENV -Append
          "HANOUTY_W2_MARIADB_BIN=$bin" | Out-File $env:GITHUB_ENV -Append
          $ready = $false
          for ($i=0; $i -lt 30; $i++) {
            & "$bin/mariadb-admin.exe" --host=127.0.0.1 --port=3307 --user=root --password=logica-ci-only ping 2>$null
            if ($LASTEXITCODE -eq 0) { $ready=$true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'Disposable MariaDB did not become ready' }
      - name: Configure isolated W2 fixture database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = $env:HANOUTY_W2_MARIADB_BIN
          "CREATE DATABASE logica_ci CHARACTER SET utf8mb4; CREATE USER 'w2_test'@'localhost' IDENTIFIED BY 'w2-disposable-only'; GRANT ALL ON logica_ci.* TO 'w2_test'@'localhost';" | & "$bin/mariadb.exe" --host=127.0.0.1 --port=3307 --user=root --password=logica-ci-only
          if ($LASTEXITCODE -ne 0) { throw 'Disposable W2 account/schema setup failed' }
          $data = Join-Path $env:RUNNER_TEMP 'hanouty-w2-data'
          New-Item -ItemType Directory -Force $data | Out-Null
          "HANOUTY_CATALOGUE_CONNECTION=Server=127.0.0.1;Port=3307;Database=logica_ci;Uid=w2_test;Pwd=w2-disposable-only;SslMode=Disabled;" | Out-File $env:GITHUB_ENV -Append
          "HANOUTY_DATA_DIRECTORY=$data" | Out-File $env:GITHUB_ENV -Append
          "HANOUTY_W2_TEST_PIN=1234" | Out-File $env:GITHUB_ENV -Append
      - name: Publish self-contained financial WPF package from this SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'hanouty-financial-package'
          ./scripts/Package-HanoutyWpf.ps1 -OutputDirectory $package -Runtime win-x64 -Mode financial
          if ($LASTEXITCODE -ne 0) { throw 'Financial WPF package publish failed' }
      - name: Test extracted financial package and double-click startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HANOUTY_W2_DISPOSABLE_MARKER = 'I_ACKNOWLEDGE_DISPOSABLE_DB_ONLY'
          $package = Join-Path $env:RUNNER_TEMP 'hanouty-financial-package'
          ./scripts/Test-HanoutyFinancialPackage.ps1 -PackageDirectory $package -EvidenceDirectory './evidence' -SourceSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Extracted financial package acceptance failed' }
      - name: Require executed same-SHA cash-sale and full-ticket refund proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content evidence/w2/w2-cash-sale.json -Raw | ConvertFrom-Json
          foreach ($field in @('CashierDialogProductionBound','TrustedQuoteDisplayed','DialogTwoSalesSameHost','LogoutLoginUi','ModalPriceChangeRejected','WindowLoaded','EditedContextRejected','SingleSessionBinding','ReviewCallbackAuthenticated','WrongReviewPinRejected','UnknownReviewBlocked','NoFinancialReplayOnReview','ExplicitReviewedUiReset','PinDialogRenderedAndCleared','InitialCashierPinUi','InitialPinCancelAndWrongRejected','CashChangeSql','SameHostDifferentTotals','PaymentContextConsumed','StaleContextBoundaryRejected','DirectSessionStaleRejected','ContextFrozenDuringPin','CashierSwitchAuthenticated','UnknownContextChangeBlocked','ChangeRowRollback','EmptyBasket','TicketPaymentStockSql','Duplicate','ProcessRestart','WrongPinRejected','WrongTotalRejected','StalePriceRejected','AfterPaymentRollback','UnknownJournalLocked','LostAcknowledgementPersisted','Reconciliation','FullCashReturnThroughWpfUi','FullCashReturnSqlReadback','FullCashReturnRollback','FullCashReturnIdempotency')) {
            if ($report.$field -ne $true) { throw "Missing executed same-SHA acceptance assertion: $field" }
          }
          if ($report.W2Accepted -ne $true) { throw 'W2 remains unaccepted: full real WPF/MariaDB evidence missing' }
          Write-Host "PASS W2 accepted on source SHA $env:GITHUB_SHA: WPF cash sale, full-ticket return, SQL readback, rollback, unknown reconciliation, exact-once"
      - name: Upload full W2 source and SQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-w2-same-sha-financial-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload accepted standalone financial WPF package
        uses: actions/upload-artifact@v4
        with:
          name: HANOUTY-WPF-financial-accepted
          path: |
            evidence/HANOUTY-WPF-net10-FINANCIAL-ACCEPTED-win-x64.zip
            evidence/financial-package-acceptance.json
          if-no-files-found: error
          retention-days: 14
      - name: Assemble one-click Windows test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'HANOUTY-WPF-TEST-BUNDLE'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item 'evidence/HANOUTY-WPF-net10-FINANCIAL-ACCEPTED-win-x64.zip' $bundle
          Copy-Item 'evidence/financial-package-acceptance.json' $bundle
          Copy-Item 'scripts/Start-Hanouty-Test.ps1' $bundle
          Copy-Item 'scripts/Start-Hanouty-Test.cmd' $bundle
          Copy-Item 'scripts/HANOUTY-TEST-START-HERE.txt' (Join-Path $bundle 'LE-MOI-DEMARRER.txt')
      - name: Run the bundled one-click test setup on Windows before download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'HANOUTY-WPF-TEST-BUNDLE'
          & (Join-Path $bundle 'Start-Hanouty-Test.ps1') -VerifyOnly
      - name: Upload one-click Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: HANOUTY-WPF-TEST-BUNDLE
          path: ${{ runner.temp }}/HANOUTY-WPF-TEST-BUNDLE/
          if-no-files-found: error
          retention-days: 14
      - name: Stop only this workflow's disposable MariaDB server
        if: always()
        shell: pwsh
        run: |
          if ($env:HANOUTY_W2_SERVER_PID) {
            $server = Get-Process -Id ([int]$env:HANOUTY_W2_SERVER_PID) -ErrorAction SilentlyContinue
            if ($server -and $server.ProcessName -eq 'mariadbd') { Stop-Process -Id $server.Id }
          }
